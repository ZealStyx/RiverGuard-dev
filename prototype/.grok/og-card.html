<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Baha</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 650;
        src: url("fonts/font-2.woff2") format("woff2");
      }
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 500;
        src: url("fonts/font-4.woff2") format("woff2");
      }
      @font-face {
        font-family: "Outfit";
        font-style: normal;
        font-weight: 600;
        src: url("fonts/font-6.woff2") format("woff2");
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #f3efe6;
        color: #1c2622;
      }
      body {
        font-family: "Outfit", sans-serif;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .lockup {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 58px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .kicker {
        margin: 0;
        color: #0e6b66;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        text-transform: uppercase;
      }
      h1 {
        margin: 18px 0 0;
        font-family: "Fraunces", serif;
        font-weight: 650;
        font-size: 300px;
        line-height: 0.84;
        letter-spacing: -0.04em;
        color: #1c2622;
      }
      .rule {
        width: 64px;
        height: 4px;
        margin: 26px 0 0;
        border: 0;
        border-radius: 999px;
        background: #9d3422;
      }
      .water {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        width: 1200px;
        height: 168px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="lockup">
        <p class="kicker">Laguna flood desk</p>
        <h1>Baha</h1>
        <hr class="rule" />
      </div>
      <svg class="water" viewBox="0 0 1200 168" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#0e6b66" d="M0 62c78-28 146-28 224 0s146 28 224 0 146-28 224 0 146 28 224 0 146-28 224 0 80-18 80-18V168H0Z"/>
        <path fill="none" stroke="#9d3422" stroke-width="3" stroke-linecap="round" d="M0 58c78-28 146-28 224 0s146 28 224 0 146-28 224 0 146 28 224 0 146-28 224 0 80-18 80-18"/>
        <path fill="none" stroke="#f3efe6" stroke-width="5" stroke-linecap="round" d="M28 104c70-24 132-24 202 0s132 24 202 0 132-24 202 0 132 24 202 0 132-24 202 0"/>
        <path fill="none" stroke="#f3efe6" stroke-width="5" stroke-linecap="round" opacity="0.62" d="M28 138c70-24 132-24 202 0s132 24 202 0 132-24 202 0 132 24 202 0 132-24 202 0"/>
      </svg>
    </div>
  </body>
</html>
