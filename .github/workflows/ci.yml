name: CI

# Every check the project claims to pass, run on the same commit.
#
# Two deliberate choices:
#
#   1. The web job builds **without** any Firebase environment. A build that
#      needs secrets is a build CI cannot verify, and that is exactly how the
#      app came to be "green" locally and broken on a fresh clone.
#   2. The ML job pins Python 3.11, the floor declared in
#      services/ml/pyproject.toml, so a dependency that quietly requires a newer
#      interpreter fails here rather than on someone's laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · typecheck, lint, format, data, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (web + convex)
        run: npm run typecheck

      - name: Authentication and authorization regression tests
        run: npm run test:auth

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Validate the dataset
        run: npm run data:validate

      - name: Build (no Firebase environment on purpose)
        run: npm run build

  ml:
    name: ML · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ml/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q
