name: PR body — strip bot attribution

# Removes agent/bot attribution footers ("🤖 Generated with Claude Code",
# "Co-Authored-By: ...", hidden <!-- generated by ... --> markers) from pull
# request bodies on open and on edit. See .github/workflows/README.md.

on:
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-body-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip-attribution:
    name: Strip attribution lines
    # Same-repository branches only: fork PRs get a read-only token, so the edit
    # would fail. Skip our own re-edits to avoid any chance of a loop.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the stripping script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          fetch-depth: 1

      - name: Strip attribution lines from the PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""' \
            > "$RUNNER_TEMP/body.md"
          python3 .github/scripts/strip_attribution.py "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/clean.md"

          if cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/clean.md"; then
            echo "No attribution lines found — nothing to do."
            exit 0
          fi

          if [ -s "$RUNNER_TEMP/clean.md" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/clean.md"
          else
            # Everything was attribution — leave a placeholder, not an empty body.
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body "_No description provided._"
          fi

          echo "PR body cleaned."
