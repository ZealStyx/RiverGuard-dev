name: PR body — strip bot attribution

# Removes agent/bot attribution footers ("🤖 Generated with Claude Code",
# "Co-Authored-By: ...", hidden <!-- generated by ... --> markers) from pull
# request bodies on open and on edit. See .github/workflows/README.md.

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-body-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  strip-attribution:
    name: Strip attribution lines
    # Same-repository branches only: fork PRs get a read-only token, so the edit
    # would fail. Skip our own re-edits to avoid any chance of a loop.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the stripping script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          fetch-depth: 1

      - name: Strip attribution lines from the PR body
        id: strip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""' \
            > "$RUNNER_TEMP/body.md"
          python3 .github/scripts/strip_attribution.py "$RUNNER_TEMP/body.md" \
            > "$RUNNER_TEMP/clean.md" 2> "$RUNNER_TEMP/stripped.log"
          cat "$RUNNER_TEMP/stripped.log" >&2

          # Compare on the script's own report, not on the files: the script
          # always normalises trailing blank lines, so `cmp` would call every
          # body "changed" and rewrite PRs that have nothing to strip.
          removed=$(grep -c '^stripped: ' "$RUNNER_TEMP/stripped.log" || true)
          if [ "${removed:-0}" -eq 0 ]; then
            echo "No attribution lines found — nothing to do."
            echo "result=nothing to remove" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "result=rewritten — removed ${removed} line(s)" >> "$GITHUB_OUTPUT"

          if [ -s "$RUNNER_TEMP/clean.md" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/clean.md"
          else
            # Everything was attribution — leave a placeholder, not an empty body.
            gh pr edit "$PR_NUMBER" --repo "$REPO" --body "_No description provided._"
          fi

          echo "PR body cleaned."

      # A workflow can rewrite the PR description, never the commits. Any
      # "Co-authored-by: arena-agent <...>" trailer stays visible on the PR
      # (GitHub lists the co-author) and in the merged history, so surface it
      # in the run summary instead of letting the job look like it did nothing.
      - name: Report attribution trailers it cannot remove
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail

          gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | select(.commit.message | test("(?m)^co-authored-by:[^\\n]*\\b(agent|arena|bot|ai|llm|assistant|claude|copilot|codex|gpt|openai|anthropic)\\b"; "i")) | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0])"' \
            > "$RUNNER_TEMP/trailers.md"

          count=$(grep -c '^- ' "$RUNNER_TEMP/trailers.md" || true)

          {
            echo "## Attribution report"
            echo
            echo "**PR body:** ${{ steps.strip.outputs.result }}"
            echo
            if [ "${count:-0}" -eq 0 ]; then
              echo "**Commits:** no attribution trailers."
            else
              echo "**Commits:** $count commit(s) carry an attribution trailer that this workflow cannot remove —"
              echo "GitHub shows the co-author on the PR and in the merged history."
              echo
              cat "$RUNNER_TEMP/trailers.md"
              echo
              echo "Prevent it on future commits with \`git commit --no-verify\` (skips the sandbox's"
              echo "\`commit-msg\` hook) or \`.git/hooks/commit-msg\` removed. Cleaning existing commits"
              echo "needs a rewrite + force-push."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
